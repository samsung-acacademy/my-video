<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Samsung AC Academy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #222;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    /* =========================
       상단
    ========================= */

    header {
      background: linear-gradient(135deg, #1428a0, #006bea);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    /* =========================
       FAQ
    ========================= */

    #faq-area {
      width: 92%;
      max-width: 900px;
      margin: 0 auto;
      padding: 25px;
      background: white;
      color: #222;
      border-radius: 16px;
      text-align: left;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    #faq-area h2 {
      margin: 0 0 20px;
      text-align: center;
      color: #1428a0;
      font-size: 24px;
    }

    .contact {
      background: #eef4ff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.7;
      font-size: 17px;
    }

    .email {
      color: #1428a0;
      font-weight: bold;
    }

    .faq-item {
      border-bottom: 1px solid #e5e5e5;
    }

    .faq-question {
      width: 100%;
      border: none;
      background: white;
      padding: 18px 35px 18px 5px;
      text-align: left;
      font-size: 15px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      position: relative;
    }

    .faq-question::after {
      content: "+";
      position: absolute;
      right: 8px;
      top: 14px;
      font-size: 22px;
      color: #1428a0;
    }

    .faq-question.active::after {
      content: "−";
    }

    .faq-answer {
      display: none;
      padding: 0 10px 18px 5px;
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }

    /* =========================
       FAQ 더보기
    ========================= */

    .faq-item.hidden-faq {
      display: none;
    }

    .faq-more-button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #eef4ff;
      color: #1428a0;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .faq-more-button:hover {
      background: #dfeaff;
    }

    /* =========================
       영상
    ========================= */

    .container {
      width: 92%;
      max-width: 900px;
      margin: 35px auto 60px;
    }

    .video-box {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 28px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .video-box h2 {
      margin: 5px 5px 15px;
      font-size: 20px;
      color: #1428a0;
      text-align: center;
    }
